<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="refresh" content="0; url=./desktop/" />
  <link rel="canonical" href="./desktop/" />
  <title>ISCEB — Institute of Supply Chain Excellence Bangladesh</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #041022, #102B4C);
      color: #FFFFFF;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: rgba(7, 26, 51, 0.94);
      border: 1.5px solid #D4AF37;
      border-radius: 18px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 8px; font-size: 22px; color: #F4E2A3; }
    p { margin: 0 0 18px; font-size: 13.5px; color: #CBD5E1; line-height: 1.5; }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      background: #D4AF37;
      color: #041022;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: #F4E2A3;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
  <script>
    window.location.replace("./desktop/" + (window.location.search || "") + (window.location.hash || ""));
  </script>
</head>
<body>
  <main class="card">
    <h1>ISCEB — Live App</h1>
    <p>Opening the live auto-updating ISCEB Workspace (Post Graduate Diploma in Supply Chain Management)...</p>
    <a class="btn-primary" href="./desktop/">Open Live ISCEB App</a>
    <a class="btn-secondary" href="./apk.html">Android APK Download Portal</a>
  </main>
</body>
</html>
