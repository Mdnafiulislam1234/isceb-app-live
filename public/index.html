<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="refresh" content="0; url=./desktop/" />
  <link rel="canonical" href="./desktop/" />
  <title>ISCEB — Institute of Supply Chain Excellence Bangladesh</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFFFF;
      color: #071A33;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 18px;
      padding: 26px 22px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(7, 26, 51, 0.08);
    }
    .logo {
      width: 180px;
      max-width: 72%;
      height: auto;
      margin: 0 auto 14px;
      display: block;
    }
    h1 { margin: 0 0 6px; font-size: 18px; color: #071A33; }
    p { margin: 0 0 18px; font-size: 13px; color: #64748B; line-height: 1.5; }
    .btn-primary {
      display: block;
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      background: #D4AF37;
      color: #071A33;
      font-weight: 800;
      font-size: 15px;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #CBD5E1;
      color: #071A33;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
  <script>
    window.location.replace("./desktop/" + (window.location.search || "") + (window.location.hash || ""));
  </script>
</head>
<body>
  <main class="card">
    <img src="./desktop/isceb-logo.webp" alt="ISCEB - Connect. learn. Achieve." class="logo" />
    <h1>ISCEB — Live Portal</h1>
    <p>Opening ISCEB Supply Chain Management Portal (Post Graduate Diploma)...</p>
    <a class="btn-primary" href="./desktop/">Open Live ISCEB App</a>
    <a class="btn-secondary" href="./apk.html">Android APK Download Portal</a>
  </main>
</body>
</html>
